name: Build Kernel (clean)

on:
  workflow_dispatch:
  push:
    branches: [ akernel-12-15 ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: akernel-12-15
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex libssl-dev make curl zip \
            python3 gcc libc6-dev libncurses-dev \
            build-essential ccache

      - name: Run build script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Find generated zips
        if: always()
        run: |
          echo "==== Tất cả file .zip trong repo ===="
          find "$GITHUB_WORKSPACE" -name "*.zip" -type f
          echo "==== Tìm thư mục AnyKernel ===="
          find "$GITHUB_WORKSPACE" -type d -iname "*anykernel*"
          echo "==== Kiểm tra kernel Image ===="
          find "$GITHUB_WORKSPACE" -path "*arch/arm64/boot/Image*"

      - name: Upload output (zip + Image)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-output
          path: |
            **/*.zip
            **/arch/arm64/boot/Image*
          if-no-files-found: warn
